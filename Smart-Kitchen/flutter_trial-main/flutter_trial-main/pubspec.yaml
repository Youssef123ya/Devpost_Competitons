publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  shared_preferences: ^2.2.2

  # Social login packages
  google_sign_in: ^6.1.0
  flutter_facebook_auth: ^6.0.0

